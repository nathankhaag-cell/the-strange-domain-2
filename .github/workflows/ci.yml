name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these checks first

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The built client is committed so `go build` needs no Node; it must
      # match the sources.
      - name: Check the committed build is up to date
        run: |
          git diff --exit-code -- ../internal/server/web
          if [ -n "$(git status --porcelain -- ../internal/server/web)" ]; then
            git status --porcelain -- ../internal/server/web
            echo "internal/server/web is out of date: run 'npm run build' in client/ and commit the result"
            exit 1
          fi
      # The phone app's build of the same client (written to mobile/www).
      - run: npm run build:app

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: for f in src/*.js electron-builder.config.js; do node --check "$f"; done
      - run: npm test

  build:
    needs: [test, client]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, name: linux-x64 }
          - { goos: linux,   goarch: arm64, name: linux-arm64-raspberrypi }
          - { goos: linux,   goarch: arm,   goarm: "7", name: linux-armv7-raspberrypi }
          - { goos: windows, goarch: amd64, name: windows-x64 }
          - { goos: darwin,  goarch: amd64, name: macos-intel }
          - { goos: darwin,  goarch: arm64, name: macos-apple-silicon }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build domain-node
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/nathankhaag-cell/the-strange-domain-2/internal/server.Version=${GITHUB_SHA::7}" \
            -o dist/ ./cmd/domain-node
      - uses: actions/upload-artifact@v4
        with:
          name: domain-node-${{ matrix.name }}
          path: dist/
